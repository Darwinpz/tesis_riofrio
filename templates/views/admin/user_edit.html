{% extends 'base.html' %}
{% block title %}Editar Usuario{% endblock %}
{% block body %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="d-flex align-items-center mb-4 gap-2">
            <a href="{{ url_for('admin.users') }}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left"></i>
            </a>
            <h4 class="mb-0">Editar Rol de Usuario</h4>
        </div>
        <div class="card shadow-sm border-0">
            <div class="card-body">
                <div class="mb-3 p-3 bg-light rounded">
                    <p class="mb-1"><strong>{{ profile.first_name }} {{ profile.last_name }}</strong></p>
                    <p class="text-muted small mb-0">{{ profile.email }}</p>
                </div>
                <form method="POST" action="{{ url_for('admin.edit_user', user_id=profile.id) }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-4">
                        <label class="form-label fw-medium">Rol del usuario</label>
                        <select name="role" class="form-select" required>
                            <option value="client" {% if profile.role == 'client' %}selected{% endif %}>
                                Cliente — visualiza sus órdenes
                            </option>
                            <option value="mechanic" {% if profile.role == 'mechanic' %}selected{% endif %}>
                                Mecánico — atiende órdenes asignadas
                            </option>
                            <option value="operator" {% if profile.role == 'operator' %}selected{% endif %}>
                                Operador — gestión de repuestos y órdenes
                            </option>
                            <option value="admin" {% if profile.role == 'admin' %}selected{% endif %}>
                                Administrador — acceso total
                            </option>
                        </select>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-dark flex-fill">
                            <i class="bi bi-save me-1"></i>Guardar
                        </button>
                        <a href="{{ url_for('admin.users') }}" class="btn btn-outline-secondary flex-fill">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
