{% extends 'base.html' %}
{% block title %}Editar Usuario{% endblock %}
{% block body %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="d-flex align-items-center mb-4 gap-2">
            <a href="{{ url_for('admin.users') }}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left"></i>
            </a>
            <div>
                <h4 class="mb-0">Editar Usuario</h4>
                <small class="text-muted">{{ profile.email }}</small>
            </div>
        </div>

        <form method="POST" action="{{ url_for('admin.edit_user', user_id=profile.id) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="card shadow-sm border-0 mb-3">
                <div class="card-header bg-dark text-white">Datos personales</div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-sm-6">
                            <label class="form-label fw-medium small">Nombre <span class="text-danger">*</span></label>
                            <input type="text" name="first_name" class="form-control"
                                   value="{{ profile.first_name }}" required>
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label fw-medium small">Apellido <span class="text-danger">*</span></label>
                            <input type="text" name="last_name" class="form-control"
                                   value="{{ profile.last_name }}" required>
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label fw-medium small">Identificación</label>
                            <input type="text" name="identification" class="form-control"
                                   value="{{ profile.identification or '' }}">
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label fw-medium small">Teléfono</label>
                            <input type="text" name="phone" class="form-control"
                                   value="{{ profile.phone or '' }}" placeholder="Ej: 0999123456">
                        </div>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm border-0 mb-3">
                <div class="card-header bg-dark text-white">Cuenta</div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-sm-6">
                            <label class="form-label fw-medium small">Email</label>
                            <input type="email" class="form-control" value="{{ profile.email }}" disabled>
                            <div class="form-text">El email no se puede cambiar.</div>
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label fw-medium small">Rol <span class="text-danger">*</span></label>
                            <select name="role" class="form-select" required>
                                <option value="client"   {% if profile.role == 'client'   %}selected{% endif %}>Cliente</option>
                                <option value="mechanic" {% if profile.role == 'mechanic' %}selected{% endif %}>Mecánico</option>
                                <option value="operator" {% if profile.role == 'operator' %}selected{% endif %}>Operador</option>
                                <option value="admin"    {% if profile.role == 'admin'    %}selected{% endif %}>Administrador</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-medium small">Nueva contraseña</label>
                            <input type="password" name="new_password" class="form-control"
                                   placeholder="Dejar vacío para no cambiarla" minlength="6" autocomplete="new-password">
                            <div class="form-text">Mínimo 6 caracteres. Solo si deseas cambiarla.</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-dark flex-fill">
                    <i class="bi bi-save me-1"></i>Guardar cambios
                </button>
                <a href="{{ url_for('admin.users') }}" class="btn btn-outline-secondary flex-fill">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
