{% extends 'base.html' %}
{% block title %}Crear Usuario{% endblock %}
{% block body %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="mc-page-header mb-4">
            <div class="d-flex align-items-center gap-3">
                <a href="{{ url_for('admin.users') }}" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <div class="mc-icon-box"><i class="bi bi-person-plus text-white fs-5"></i></div>
                <div>
                    <h4 class="mb-0 fw-bold">Crear Nuevo Usuario</h4>
                    <small>Asigna credenciales y rol al usuario</small>
                </div>
            </div>
        </div>
        <div class="card shadow-sm border-0">
            <div class="card-body">
                <form method="POST" action="{{ url_for('admin.create_user') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-medium">Nombre <span class="text-danger">*</span></label>
                            <input type="text" name="first_name" class="form-control"
                                   value="{{ first_name or '' }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-medium">Apellido <span class="text-danger">*</span></label>
                            <input type="text" name="last_name" class="form-control"
                                   value="{{ last_name or '' }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-medium">Identificación</label>
                            <input type="text" name="identification" class="form-control"
                                   value="{{ identification or '' }}" placeholder="Opcional">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-medium">Teléfono</label>
                            <input type="text" name="phone" class="form-control"
                                   value="{{ phone or '' }}" placeholder="Opcional">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-medium">Correo electrónico <span class="text-danger">*</span></label>
                            <input type="email" name="email" class="form-control"
                                   value="{{ email or '' }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-medium">Contraseña <span class="text-danger">*</span></label>
                            <input type="password" name="password" class="form-control"
                                   required minlength="6" placeholder="Mínimo 6 caracteres">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-medium">Rol <span class="text-danger">*</span></label>
                            <select name="role" class="form-select" required>
                                <option value="client" {% if role == 'client' %}selected{% endif %}>
                                    Cliente
                                </option>
                                <option value="mechanic" {% if role == 'mechanic' %}selected{% endif %}>
                                    Mecánico
                                </option>
                                <option value="operator" {% if role == 'operator' %}selected{% endif %}>
                                    Operador
                                </option>
                                <option value="admin" {% if role == 'admin' %}selected{% endif %}>
                                    Administrador
                                </option>
                            </select>
                        </div>
                    </div>
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-dark flex-fill">
                            <i class="bi bi-person-check me-1"></i>Crear Usuario
                        </button>
                        <a href="{{ url_for('admin.users') }}" class="btn btn-outline-secondary flex-fill">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
