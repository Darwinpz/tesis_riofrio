{% extends 'base.html' %}
{% block title %}{{ 'Nueva' if action == 'create' else 'Editar' }} Marca{% endblock %}
{% block body %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="d-flex align-items-center mb-4 gap-2">
            <a href="{{ url_for('brands.index') }}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left"></i>
            </a>
            <h4 class="mb-0">{{ 'Nueva Marca' if action == 'create' else 'Editar Marca' }}</h4>
        </div>
        <div class="card shadow-sm border-0">
            <div class="card-body">
                <form method="POST"
                      action="{{ url_for('brands.create') if action == 'create' else url_for('brands.edit', brand_id=brand.id) }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">Nombre <span class="text-danger">*</span></label>
                        <input type="text" name="name" class="form-control" required
                               value="{{ brand.name if brand else '' }}" placeholder="Ej: Toyota">
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Descripción</label>
                        <textarea name="description" class="form-control" rows="3"
                                  placeholder="Descripción opcional">{{ brand.description if brand and brand.description else '' }}</textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-dark flex-fill">
                            <i class="bi bi-save me-1"></i>Guardar
                        </button>
                        <a href="{{ url_for('brands.index') }}" class="btn btn-outline-secondary flex-fill">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
