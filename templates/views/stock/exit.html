{% extends 'base.html' %}
{% block title %}Registrar Salida{% endblock %}
{% block body %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="mc-page-header mb-4">
            <div class="d-flex align-items-center gap-3">
                <a href="{{ url_for('stock.index') }}" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <div class="mc-icon-box"><i class="bi bi-box-arrow-up-right text-white fs-5"></i></div>
                <div>
                    <h4 class="mb-0 fw-bold">Registrar Salida de Stock</h4>
                    <small>Venta directa, orden de trabajo o ajuste</small>
                </div>
            </div>
        </div>
        <div class="card shadow-sm border-0">
            <div class="card-body">
                <form method="POST" action="{{ url_for('stock.exit') }}"
                      enctype="multipart/form-data" id="exitForm">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">Repuesto <span class="text-danger">*</span></label>
                        <div class="mc-ss-wrapper">
                            <input type="text" class="form-control mc-ss-input" id="partSearch"
                                   placeholder="Buscar por código o nombre..." autocomplete="off">
                            <input type="hidden" name="spare_part_id" id="partId">
                            <div class="mc-ss-dropdown" id="partDrop"></div>
                        </div>
                    </div>
                    <div id="stockInfo" class="alert alert-warning py-2 small d-none">
                        <i class="bi bi-info-circle me-1"></i>
                        Stock disponible: <strong id="currentStock">—</strong>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Cantidad <span class="text-danger">*</span></label>
                        <input type="number" name="quantity" class="form-control" min="1" required id="qtyInput"
                               placeholder="Cantidad a retirar">
                        <div id="stockWarn" class="text-danger small mt-1 d-none">
                            La cantidad supera el stock disponible
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Motivo <span class="text-danger">*</span></label>
                        <select name="motive" class="form-select" required>
                            <option value="">Seleccionar motivo...</option>
                            <option value="venta_directa">Venta directa</option>
                            <option value="ajuste">Ajuste de inventario</option>
                            <option value="danio">Daño / Pérdida</option>
                            <option value="orden_trabajo">Orden de trabajo manual</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nota</label>
                        <textarea name="note" class="form-control" rows="2"
                                  placeholder="Observaciones adicionales..."></textarea>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">
                            <i class="bi bi-paperclip me-1"></i>Factura / Comprobante
                            <span class="text-muted small">(PDF, imagen)</span>
                        </label>
                        <input type="file" name="attachment" class="form-control"
                               accept=".pdf,.png,.jpg,.jpeg,.gif,.webp">
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger flex-fill">
                            <i class="bi bi-check-lg me-1"></i>Registrar Salida
                        </button>
                        <a href="{{ url_for('stock.index') }}" class="btn btn-outline-secondary flex-fill">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script>
let currentStock = 0;
const partsData = [{% for p in parts %}{id:{{ p.id | tojson }},label:{{ (p.code + ' — ' + p.name) | tojson }},stock:{{ p.stock_actual }}}{% if not loop.last %},{% endif %}{% endfor %}];

initMcSelect({
    input: document.getElementById('partSearch'),
    hidden: document.getElementById('partId'),
    drop: document.getElementById('partDrop'),
    data: partsData,
    labelFn: d => `${d.label} (stock: ${d.stock})`,
    valueFn: d => d.id,
    onSelect: function(part) {
        const info = document.getElementById('stockInfo');
        if (part) {
            currentStock = part.stock;
            document.getElementById('currentStock').textContent = currentStock;
            info.classList.remove('d-none');
        } else {
            info.classList.add('d-none');
            currentStock = 0;
        }
        checkQty();
    }
});

{% if preselect %}
(function() {
    const pre = partsData.find(p => p.id === {{ preselect | tojson }});
    if (pre) {
        document.getElementById('partSearch').value = `${pre.label} (stock: ${pre.stock})`;
        document.getElementById('partId').value = pre.id;
        currentStock = pre.stock;
        document.getElementById('currentStock').textContent = currentStock;
        document.getElementById('stockInfo').classList.remove('d-none');
        checkQty();
    }
})();
{% endif %}

document.getElementById('qtyInput').addEventListener('input', checkQty);
function checkQty() {
    const qty = parseInt(document.getElementById('qtyInput').value) || 0;
    document.getElementById('stockWarn').classList.toggle('d-none', qty <= currentStock || !currentStock);
}

document.getElementById('exitForm').addEventListener('submit', function(e) {
    if (!document.getElementById('partId').value) {
        e.preventDefault();
        const inp = document.getElementById('partSearch');
        inp.classList.add('is-invalid');
        inp.focus();
    }
});
document.getElementById('partSearch').addEventListener('input', function() {
    this.classList.remove('is-invalid');
});
</script>
{% endblock %}
