{% extends 'base.html' %}
{% block title %}Registrar Entrada{% endblock %}
{% block body %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="mc-page-header mb-4">
            <div class="d-flex align-items-center gap-3">
                <a href="{{ url_for('stock.index') }}" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <div class="mc-icon-box"><i class="bi bi-box-arrow-in-down-right text-white fs-5"></i></div>
                <div>
                    <h4 class="mb-0 fw-bold">Registrar Entrada de Stock</h4>
                    <small>Compra, devolución o ajuste de inventario</small>
                </div>
            </div>
        </div>
        <div class="card shadow-sm border-0">
            <div class="card-body">
                <form method="POST" action="{{ url_for('stock.entry') }}"
                      enctype="multipart/form-data" id="entryForm">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">Repuesto <span class="text-danger">*</span></label>
                        <div class="mc-ss-wrapper">
                            <input type="text" class="form-control mc-ss-input" id="partSearch"
                                   placeholder="Buscar por código o nombre..." autocomplete="off">
                            <input type="hidden" name="spare_part_id" id="partId">
                            <div class="mc-ss-dropdown" id="partDrop"></div>
                        </div>
                    </div>
                    <div id="stockInfo" class="alert alert-info py-2 small d-none">
                        <i class="bi bi-info-circle me-1"></i>
                        Stock actual: <strong id="currentStock">—</strong>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Cantidad <span class="text-danger">*</span></label>
                        <input type="number" name="quantity" class="form-control" min="1" required
                               placeholder="Cantidad a ingresar">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Motivo <span class="text-danger">*</span></label>
                        <select name="motive" class="form-select" required id="motiveSel">
                            <option value="">Seleccionar motivo...</option>
                            <option value="compra">Compra a proveedor</option>
                            <option value="devolucion">Devolución</option>
                            <option value="ajuste">Ajuste de inventario</option>
                        </select>
                    </div>
                    <div class="mb-3" id="supplierSection" style="display:none;">
                        <label class="form-label">Proveedor</label>
                        <select name="supplier_id" class="form-select" id="supplierSel">
                            <option value="">Sin especificar</option>
                            {% for s in suppliers %}
                            <option value="{{ s.id }}">{{ s.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nota</label>
                        <textarea name="note" class="form-control" rows="2"
                                  placeholder="Observaciones adicionales..."></textarea>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">
                            <i class="bi bi-paperclip me-1"></i>Factura / Comprobante
                            <span class="text-muted small">(PDF, imagen)</span>
                        </label>
                        <input type="file" name="attachment" class="form-control"
                               accept=".pdf,.png,.jpg,.jpeg,.gif,.webp">
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success flex-fill">
                            <i class="bi bi-check-lg me-1"></i>Registrar Entrada
                        </button>
                        <a href="{{ url_for('stock.index') }}" class="btn btn-outline-secondary flex-fill">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script>
const partsData = [{% for p in parts %}{id:{{ p.id | tojson }},label:{{ (p.code + ' — ' + p.name) | tojson }},stock:{{ p.stock_actual }}}{% if not loop.last %},{% endif %}{% endfor %}];

initMcSelect({
    input: document.getElementById('partSearch'),
    hidden: document.getElementById('partId'),
    drop: document.getElementById('partDrop'),
    data: partsData,
    labelFn: d => `${d.label} (stock: ${d.stock})`,
    valueFn: d => d.id,
    onSelect: function(part) {
        const info = document.getElementById('stockInfo');
        if (part) {
            document.getElementById('currentStock').textContent = part.stock;
            info.classList.remove('d-none');
        } else {
            info.classList.add('d-none');
        }
    }
});

{% if preselect %}
(function() {
    const pre = partsData.find(p => p.id === {{ preselect | tojson }});
    if (pre) {
        document.getElementById('partSearch').value = `${pre.label} (stock: ${pre.stock})`;
        document.getElementById('partId').value = pre.id;
        document.getElementById('currentStock').textContent = pre.stock;
        document.getElementById('stockInfo').classList.remove('d-none');
    }
})();
{% endif %}

document.getElementById('motiveSel').addEventListener('change', function() {
    document.getElementById('supplierSection').style.display = this.value === 'compra' ? '' : 'none';
});

document.getElementById('entryForm').addEventListener('submit', function(e) {
    if (!document.getElementById('partId').value) {
        e.preventDefault();
        const inp = document.getElementById('partSearch');
        inp.classList.add('is-invalid');
        inp.focus();
    }
});
document.getElementById('partSearch').addEventListener('input', function() {
    this.classList.remove('is-invalid');
});
</script>
{% endblock %}
